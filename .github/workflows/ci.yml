name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux-three-db:
    name: Linux (GCC) - SQLite + MySQL + PostgreSQL
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pw
          MYSQL_DATABASE: uorm_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot_ci_pw"
          --health-interval=10s --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_pg_pw
          POSTGRES_DB: uorm_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libmariadb-dev libpq-dev libsqlite3-dev libasio-dev doctest-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DUORM_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ./build/uorm_test_unit

      - name: Integration tests (SQLite + MySQL + PostgreSQL)
        run: ./build/uorm_test_integration
        env:
          UORM_TEST_MYSQL_HOST: 127.0.0.1
          UORM_TEST_MYSQL_PORT: "3306"
          UORM_TEST_MYSQL_USER: root
          UORM_TEST_MYSQL_PASS: ci_root_pw
          UORM_TEST_MYSQL_DB: uorm_db
          UORM_TEST_PG_HOST: 127.0.0.1
          UORM_TEST_PG_PORT: "5432"
          UORM_TEST_PG_USER: postgres
          UORM_TEST_PG_PASS: ci_pg_pw
          UORM_TEST_PG_DB: uorm_db

  windows-mingw:
    name: Windows (MinGW-w64) - SQLite
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-doctest

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DUORM_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ./build/uorm_test_unit.exe

      - name: Integration tests (SQLite)
        run: ./build/uorm_test_integration.exe
